<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kier Libros · Simulador de compra</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__marca">
      <img src="assets/img/logo.svg" alt="Logo de Kier Libros" class="encabezado__logo">
      <h1>Kier Libros</h1>
    </div>
    <a href="#panelCarrito" class="btn btn--carrito">
      Carrito <span id="contadorCarrito" class="contador">0</span>
    </a>
  </header>

  <main class="layout">
    <section class="catalogo" aria-labelledby="tituloCatalogo">
      <h2 id="tituloCatalogo">Catálogo</h2>

      <div class="filtros">
        <input type="search" id="inputBusqueda" placeholder="Buscar por título o autor" aria-label="Buscar">
        <select id="selectGenero" aria-label="Filtrar por género">
          <option value="todos">Todos los géneros</option>
        </select>
        <select id="selectOrden" aria-label="Ordenar">
          <option value="relevancia">Orden original</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="titulo">Título A-Z</option>
        </select>
      </div>

      <p id="estadoCarga" class="estado" hidden>Cargando catálogo…</p>
      <div id="errorCarga" class="estado estado--error" hidden>
        <p id="mensajeError"></p>
        <button type="button" id="btnReintentar" class="btn btn--primario">Reintentar</button>
      </div>

      <div id="gridLibros" class="grid"></div>
    </section>

    <aside class="panel" id="panelCarrito" aria-labelledby="tituloCarrito">
      <h2 id="tituloCarrito">Tu carrito</h2>

      <div id="carritoVacio" class="carrito-vacio">
        <img src="assets/img/carrito-vacio.svg" alt="" width="96" height="96">
        <p>Tu carrito está vacío.</p>
      </div>
      <ul id="listaCarrito" class="carrito"></ul>

      <form id="formCheckout" class="checkout" novalidate hidden>
        <label>Envío
          <select id="selectEnvio" name="envio"></select>
        </label>
        <label>Medio de pago
          <select id="selectPago" name="pago"></select>
        </label>
        <label>Nombre y apellido
          <input type="text" name="nombre" autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email">
        </label>
        <p id="errorFormulario" class="error-form" hidden></p>

        <div id="resumen" class="resumen"></div>

        <button type="submit" class="btn btn--primario">Confirmar compra</button>
        <button type="button" id="btnVaciar" class="btn btn--secundario">Vaciar carrito</button>
      </form>

      <section class="historial" aria-labelledby="tituloHistorial">
        <h2 id="tituloHistorial">Pedidos anteriores</h2>
        <ul id="listaPedidos" class="pedidos"></ul>
        <button type="button" id="btnBorrarHistorial" class="btn btn--secundario">Borrar historial</button>
      </section>
    </aside>
  </main>

  <footer class="pie">Simulador educativo · Proyecto final JavaScript</footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
